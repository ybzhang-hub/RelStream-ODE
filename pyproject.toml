[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relstream-ode"
version = "1.1.0"
description = "Coupled relation dynamics and adaptive graph transport for event forecasting"
requires-python = ">=3.10"
dependencies = ["torch==2.4.0", "numpy==1.26.4", "scipy==1.12.0", "matplotlib==3.9.2"]

[tool.setuptools.packages.find]
where = ["src"]
